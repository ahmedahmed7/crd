apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: simpleconfigs.config.example.com
spec:
  group: config.example.com
  names:
    plural: simpleconfigs
    singular: simpleconfig
    kind: SimpleConfig
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                data:
                  type: object
                  additionalProperties:
                    type: string
            status:
              type: object
              properties:
                configMapName:
                  type: string
                synced:
                  type: boolean
      subresources:
        status: {}
